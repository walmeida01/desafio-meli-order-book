services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderbook
      POSTGRES_USER: orderbook
      POSTGRES_PASSWORD: orderbook
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderbook -d orderbook"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      Postgres__ConnectionString: Host=postgres;Port=5432;Database=orderbook;Username=orderbook;Password=orderbook
      Postgres__ApplySeed: "true"
      DEPLOYMENT_ENVIRONMENT_NAME: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
  alloy:
    image: grafana/alloy:v1.7.5
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports: ["12345:12345", "4317:4317", "4318:4318"]
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./deploy/observability/loki/config.yaml:/etc/loki/local-config.yaml:ro
  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["3200:3200", "4319:4317"]
    volumes:
      - ./deploy/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  tempo-data:
