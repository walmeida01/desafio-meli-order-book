apiVersion: 1

datasources:
  - name: OrderBook Prometheus
    uid: orderbook-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: OrderBook Loki
    uid: orderbook-loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: OrderBook Tempo
    uid: orderbook-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: orderbook-loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{${__tags}} | json | trace_id = `${__trace.traceId}`'
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: orderbook-prometheus
        tags: [{ key: service.name, value: service }]
      serviceMap:
        datasourceUid: orderbook-prometheus
